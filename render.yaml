services:
  # FastAPI Backend (Dockerized Web Service)
  - type: web
    name: ai-recruiter-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # You will paste your actual API key here in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://ai-recruiter-ui.onrender.com

  # React Frontend (Static Site - Free & Fast)
  - type: web
    name: ai-recruiter-ui
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-recruiter-api
          envVarKey: RENDER_EXTERNAL_URL
